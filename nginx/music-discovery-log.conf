server {
    listen 80;
    server_name grayson-webdev.org www.grayson-webdev.org;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name grayson-webdev.org www.grayson-webdev.org;

    ssl_certificate /etc/letsencrypt/live/grayson-webdev.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grayson-webdev.org/privkey.pem;

    root /var/www/music-discovery-log/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
