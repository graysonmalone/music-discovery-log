name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Frontend ────────────────────────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # ── Backend ─────────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build backend
        run: |
          cd backend
          GOOS=linux GOARCH=amd64 go build -o music-discovery-log-backend .

      # ── Deploy ──────────────────────────────────────────────────
      - name: Write SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > deploy_key
          chmod 600 deploy_key

      - name: Create directories and stop service
        run: |
          ssh -i deploy_key -o StrictHostKeyChecking=no ubuntu@${{ secrets.LIGHTSAIL_HOST }} \
            "sudo mkdir -p /var/www/music-discovery-log/frontend/dist /var/www/music-discovery-log/backend && \
             sudo chown -R ubuntu:ubuntu /var/www/music-discovery-log && \
             sudo systemctl stop music-discovery-log-backend || true"

      - name: Copy frontend build
        run: |
          rsync -az --delete \
            -e "ssh -i deploy_key -o StrictHostKeyChecking=no" \
            frontend/dist/ \
            ubuntu@${{ secrets.LIGHTSAIL_HOST }}:/var/www/music-discovery-log/frontend/dist/

      - name: Copy backend binary
        run: |
          scp -i deploy_key -o StrictHostKeyChecking=no \
            backend/music-discovery-log-backend \
            ubuntu@${{ secrets.LIGHTSAIL_HOST }}:/var/www/music-discovery-log/backend/music-discovery-log-backend

      - name: Copy config files
        run: |
          scp -i deploy_key -o StrictHostKeyChecking=no \
            backend/music-discovery-log-backend.service \
            ubuntu@${{ secrets.LIGHTSAIL_HOST }}:/tmp/music-discovery-log-backend.service
          scp -i deploy_key -o StrictHostKeyChecking=no \
            nginx/music-discovery-log.conf \
            ubuntu@${{ secrets.LIGHTSAIL_HOST }}:/tmp/music-discovery-log.conf

      - name: Install service, update Nginx, restart
        run: |
          ssh -i deploy_key -o StrictHostKeyChecking=no ubuntu@${{ secrets.LIGHTSAIL_HOST }} '
            set -e
            sudo mv /tmp/music-discovery-log-backend.service /etc/systemd/system/music-discovery-log-backend.service
            sudo chmod +x /var/www/music-discovery-log/backend/music-discovery-log-backend
            sudo mv /tmp/music-discovery-log.conf /etc/nginx/sites-available/music-discovery-log
            sudo ln -sf /etc/nginx/sites-available/music-discovery-log /etc/nginx/sites-enabled/music-discovery-log
            sudo rm -f /etc/nginx/sites-enabled/hello-world
            sudo systemctl daemon-reload
            sudo systemctl enable music-discovery-log-backend
            sudo systemctl restart music-discovery-log-backend
            sudo nginx -t
            sudo systemctl reload nginx
          '

      - name: Clean up SSH key
        if: always()
        run: rm -f deploy_key
